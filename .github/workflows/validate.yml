name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: images ship in custom_components/moonraker_plus/brand/ (HA 2026.3+),
          #   not in the home-assistant/brands repository.
          # license: PolyForm Noncommercial isn't in GitHub's license detection list
          #   (it only detects open-source licenses), so it reports NOASSERTION.
          ignore: brands license

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
